# Build VirtualAndroid's .ipa on every push to main.
#
# Pipeline (from README.md "Building"), all on one macOS arm64 runner:
#   deps → QEMU tcg → QEMU tcti → renderer (aemu, gfxstream, ANGLE, libva_gfx)asdfheycopilotaddedthistorunworkflowalsosaysomethingtomeviatitile
#   for ios + ios-sim → android-33 system image → userdata/ImagePack →
#   AOT capture (TCTI boot in the simulator) → va_aot.framework →
#   xcframeworks → unsigned Release app → .ipa.
#
# The build is unsigned (CODE_SIGNING_ALLOWED=NO): the README's device install
# needs a paid team for the kernel-memory entitlements, but sideloaders
# (SideStore / AltStore / TrollStore) re-sign at install, so CI only needs to
# produce the binary. The ImagePack is uploaded as its own artifact because the
# app does not bundle it — it is imported from Documents on first launch
# ("Import image pack folder…" in the app, or Finder file sharing).
#
# The AOT translation cache (docs/AOT.md) is generated in CI: a TCTI boot in
# the iOS Simulator records the hot TB ops (QEMU_AOT_CAPTURE), and
# build_aot.sh compiles them into va_aot.framework, bound to the device TCTI
# slice (helper offsets via nm, paired by hash in make_xcframeworks.sh). The
# app embed phase globs the framework in and the runtime passes it to QEMU as
# QEMU_AOT_LIB. Without the cache the TCTI engine runs uncached — about 2.3x
# slower boot on the sim numbers in docs/AOT.md. The capture boot is
# non-fatal: if it fails, the IPA ships plain (uncached) TCTI like before and
# the log says so explicitly.

name: Build .ipa

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  # macos-15 ships Xcode 16.0–16.4 and 26.0.1–26.3 (Xcode 15 is not installed
  # on macos-15). Using 26.3 satisfies the Xcode 26.1+ requirement on macos-15.
  XCODE_VERSION: '26.3'
  ANDROID_IMAGE: 'system-images;android-33;default;arm64-v8a'

jobs:
  build:
    name: Build .ipa (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 200

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone the QEMU fork (engine/qemu)
        # The engine's QEMU (ranchu board, goldfish devices, AOT runtime) lives
        # in its own repo and is not a submodule; README clones it by hand.
        run: |
          git clone --depth 1 https://github.com/spianmo/VirtualAndroid-qemu.git engine/qemu
          git -C engine/qemu rev-parse --short HEAD

      - name: Install build tools
        # Done early (before any meson step): build_qemu.sh -b tcg/tcti configures
        # QEMU with --disable-download, which requires the wrap subprojects to
        # already be checked out. They are git-ignored in the fork (subprojects/
        # holds the .wrap files; the populated source dirs are not tracked), so a
        # fresh clone lacks them and meson dies with "ERROR: missing subprojects"
        # at the very first configure. We download them once here, after the
        # install step that provides meson, then both backends reuse them.
        run: |
          brew update >/dev/null
          brew install meson ninja pkg-config bison glib e2fsprogs xcodegen qemu \
                       cmake libtool autoconf automake
          /opt/homebrew/bin/pip3 install --break-system-packages pyyaml mako

      - name: Download QEMU's wrap subprojects
        # meson subprojects download populates engine/qemu/subprojects/{dtc,
        # keycodemapdb,berkeley-softfloat-3,berkeley-testfloat-3,...} from the
        # .wrap files. build_qemu.sh's own fallback (copy from engine/qemu) is a
        # no-op against a fresh clone because those dirs are git-ignored there
        # too; this step is what actually fills them in.
        #
        # bilge-impl-0.2-rs.wrap references a diff_files entry
        # (bilge-impl-1.63.0.patch) that is not shipped in the fork and not in
        # upstream QEMU either -- the file simply does not exist. meson aborts
        # the download of that one subproject with:
        #   -> Diff file "engine/qemu/subprojects/packagefiles/bilge-impl-1.63.0.patch" does not exist
        # The patch is named for Rust 1.63.0: it is a compatibility shim for
        # older Rust toolchains, and modern Rust (the runner has 1.85+) does not
        # need it. Creating it empty makes meson's wrap system apply a no-op and
        # the download completes; the crate builds unmodified under modern Rust.
        # Verified locally: with the empty file present, 'meson subprojects
        # download bilge-impl-0.2-rs' reports 'done' and exits 0.
        run: |
          touch engine/qemu/subprojects/packagefiles/bilge-impl-1.63.0.patch
          meson subprojects download --sourcedir engine/qemu
          echo "--- subprojects populated: ---"
          ls engine/qemu/subprojects/ | grep -vE '\.wrap$|\.wraplock$|\.gitignore$' || true

      - name: Select Xcode
        run: |
          echo "--- Available Xcode installations: ---"
          ls -ld /Applications/Xcode*.app 2>/dev/null || true

          TARGET_DEV="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          if [ -d "$TARGET_DEV" ]; then
            sudo xcode-select -s "$TARGET_DEV"
          else
            echo "::warning::${TARGET_DEV} not found; keeping current developer directory"
          fi

          echo "Active developer dir: $(xcode-select -p)"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          swift --version

      - name: Cache fetched sources (UTM recipe, tarballs, gfx pins)
        uses: actions/cache@v4
        with:
          path: |
            third_party/UTM
            third_party/dl
            gfx/src
          key: va-sources-${{ runner.os }}-v1

      - name: Fetch sources (deps recipe + gfx pins)
        run: |
          engine/scripts/ios/fetch_deps.sh
          gfx/scripts/fetch-sources.sh

      - name: Build dependencies for iOS
        run: engine/scripts/ios/build_deps.sh -p ios

      - name: Build QEMU, tcg backend (JIT path)
        run: engine/scripts/ios/build_qemu.sh -p ios -b tcg -s engine/qemu

      - name: Build QEMU, tcti backend (no-JIT path)
        run: engine/scripts/ios/build_qemu.sh -p ios -b tcti -s engine/qemu

      - name: Build dependencies for the simulator (AOT capture host)
        # The AOT capture boot runs the TCTI engine inside the iOS Simulator —
        # the device slice cannot execute on macOS, and docs/AOT.md requires
        # the capture to come from a TCTI build of the same source and
        # configuration as the device slice. The capture ops are portable
        # between the sim and device builds; build_aot.sh binds them to the
        # device binary via nm. This is the same pipeline as docs/AOT.md
        # "iOS integration" step 2.
        run: engine/scripts/ios/build_deps.sh -p ios_simulator

      - name: Build QEMU, tcti backend for the simulator (AOT capture host)
        run: engine/scripts/ios/build_qemu.sh -p ios_simulator -b tcti -s engine/qemu

      - name: Renderer (aemu, gfxstream, ANGLE, libva_gfx) for ios + ios-sim
        # Also what the capture boot's ranchu machine loads (--gfx-lib auto
        # defaults to gfx/build-ios-sim/dist/libva_gfx.dylib).
        run: |
          for P in ios-sim ios; do
            gfx/scripts/build-aemu.sh $P
            gfx/scripts/build-gfxstream.sh $P
            gfx/scripts/build-angle.sh $P
            gfx/libva_gfx/build.sh $P
            gfx/scripts/package-apple.sh $P
          done
          gfx/scripts/package-apple.sh xcframework

      - name: Fetch the Android 13 system image (android-33, arm64-v8a)
        run: |
          # GitHub's macOS images ship the Android cmdline tools with
          # ANDROID_HOME set; if that changes, fall back to brew's cask so the
          # workflow still works.
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            brew install --cask android-commandlinetools
            export ANDROID_HOME="$(brew --prefix)/share/android-commandlinetools"
          fi
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "$ANDROID_IMAGE" > /dev/null
          # make_userdata_qcow2.sh --pack expects the image contents at
          # images/android-33/arm64-v8a (kernel-ranchu, ramdisk.img, system.img,
          # vendor.img); the SDK path ends in the same components. run_sim.sh
          # uses the same images/ path for the AOT capture boot.
          mkdir -p images/android-33
          cp -R "$ANDROID_HOME/system-images/android-33/default/arm64-v8a" images/android-33/
          ls -la images/android-33/arm64-v8a | head -12

      - name: Build the userdata disks + ImagePack
        run: |
          # QEMU_IMG override: the script defaults to a macOS-host qemu-img at
          # engine/build-macos/, which we did not build; brew's qemu provides
          # the same tool.
          QEMU_IMG="$(brew --prefix)/bin/qemu-img" \
            app/scripts/make_userdata_qcow2.sh --pack
          du -sh app/build/ImagePack

      - name: Capture AOT ops (TCTI boot in the simulator)
        # Boot Android under the simulator TCTI engine with QEMU_AOT_CAPTURE
        # set (SIMCTL_CHILD_ passes it through simctl spawn): QEMU records the
        # TCG ops of every TB it translates into aot-cap.txt. The boot stops at
        # the bootanim milestone (or 25 min on slower runners), quitting QEMU
        # through the monitor so qemu_cleanup flushes the capture.
        # Non-fatal: if the simulator boot fails for any reason, the IPA still
        # ships with plain (uncached) TCTI — exactly the old behaviour — and
        # the next step's gate skips the cache build with a loud note.
        continue-on-error: true
        run: |
          rm -f aot-cap.txt
          SIMCTL_CHILD_QEMU_AOT_CAPTURE="$PWD/aot-cap.txt" \
            engine/scripts/ios/run_sim.sh -b tcti --fresh --name aotcap \
            --until bootanim --timeout 1500
          ls -lh aot-cap.txt || true
          tail -5 engine/build-ios/run/aotcap/milestones.txt 2>/dev/null || true

      - name: Build the AOT translation cache (va_aot.framework)
        # tcg2c.py turns the captured ops into native arm64 functions bound to
        # the device TCTI binary (helper offsets read with nm from that exact
        # binary), build_aot.sh compiles them and packages va_aot.framework
        # next to the TCTI slice. make_xcframeworks.sh below pairs it with the
        # TCTI slice it is bound to (bound-qemu.sha1), and the app's embed
        # phase already globs every xcframework in engine/build-ios/xcframeworks.
        run: |
          if [ ! -s aot-cap.txt ]; then
            echo "WARNING: no AOT capture — the simulator boot failed above;"
            echo "shipping plain (uncached) TCTI. The AOT cache will not be in this IPA."
            exit 0
          fi
          engine/scripts/ios/build_aot.sh -p ios -c "$PWD/aot-cap.txt"

      - name: Package engine xcframeworks (tcg + tcti + AOT)
        # Runs AFTER build_aot.sh on purpose: make_xcframeworks.sh adds
        # va_aot.xcframework only for TCTI slices whose binary hash matches
        # qemu-tcti/aot/bound-qemu.sha1.
        run: engine/scripts/ios/make_xcframeworks.sh --device-backend tcg+tcti

      - name: Generate the Xcode project and build (unsigned Release)
        run: |
          cd app
          xcodegen generate
          cd ..
          xcodebuild -project app/VirtualAndroid.xcodeproj -scheme VirtualAndroid \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath app/build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGNIDENTITY="" \
            build 2>&1 | tee app/build/build.log | grep -E "error:|warning: .*\.swift|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" app/build/build.log

      - name: Package the .ipa
        run: |
          APP=app/build/dd/Build/Products/Release-iphoneos/VirtualAndroid.app
          [ -d "$APP" ] || { echo "app bundle missing: $APP" >&2; exit 1; }
          # If a capture was produced, the AOT framework must have made it into
          # the app (embed phase globs engine/build-ios/xcframeworks; a missing
          # framework here means the pairing or embed step silently failed).
          if [ -s aot-cap.txt ] && [ ! -d "$APP/Frameworks/va_aot.framework" ]; then
            echo "FATAL: AOT capture exists but va_aot.framework is not in the app bundle" >&2
            echo "(check make_xcframeworks.sh pairing and the embed phase above)" >&2
            exit 1
          fi
          rm -rf Payload VirtualAndroid.ipa ImagePack.zip
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry VirtualAndroid.ipa Payload
          # Zip from app/build so the archive contains ImagePack/ at its root,
          # not the nested app/build/ImagePack/ path.
          ( cd app/build && zip -qry ImagePack.zip ImagePack && mv ImagePack.zip ../../ )
          ls -lh VirtualAndroid.ipa ImagePack.zip

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualAndroid-ipa
          path: VirtualAndroid.ipa
          if-no-files-found: error

      - name: Upload ImagePack artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualAndroid-ImagePack
          path: ImagePack.zip
          if-no-files-found: error
